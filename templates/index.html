<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Парсер роллов 🍣</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="max-w-2xl mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold text-center mb-6">Парсер сетов роллов 🍱</h1>
    <form method="POST" action="/" class="flex flex-col gap-4">
        <input type="url" name="url" placeholder="Вставьте ссылку на страницу с роллами" required
               class="border border-gray-300 rounded-xl p-3 w-full focus:ring focus:ring-indigo-300">
        <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl p-3 transition">
            Спарсить
        </button>
    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="mt-6">
                {% for category, message in messages %}
                    <div class="p-3 rounded-xl text-white {% if category == 'error' %}bg-red-500{% else %}bg-green-500{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
</div>
</body>
</html>
