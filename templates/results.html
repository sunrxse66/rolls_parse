<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результаты парсинга</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<div class="max-w-6xl mx-auto mt-10 bg-white shadow-lg rounded-2xl p-6">
    <h1 class="text-2xl font-bold mb-6 text-center">Результаты парсинга с сайта</h1>

    <div class="overflow-x-auto">
        <table class="min-w-full border border-gray-300 rounded-lg overflow-hidden">
            <thead class="bg-indigo-600 text-white">
                <tr>
                    <th class="p-3 text-left w-40">Фото</th>
                    <th class="p-3 text-left">Название</th>
                    <th class="p-3 text-left">Описание</th>
                    <th class="p-3 text-center">Цена (оригинал)</th>
                    <th class="p-3 text-center">Цена (+20%)</th>
                </tr>
            </thead>
            <tbody>
                {% for item in rolls %}
                <tr class="border-b hover:bg-gray-50 transition">
                    <td class="p-3 text-center">
                        {% if item.image_url %}
                            <img src="{{ item.image_url }}"
                                 alt="{{ item.name }}"
                                 class="w-32 h-32 object-cover mx-auto rounded-xl shadow-md border border-gray-200">
                        {% else %}
                            <span class="text-gray-400 text-sm">Нет фото</span>
                        {% endif %}
                    </td>
                    <td class="p-3 font-semibold">{{ item.name }}</td>
                    <td class="p-3">{{ item.description }}</td>
                    <td class="p-3 text-center">{{ item.original_price }}₽</td>
                    <td class="p-3 text-center font-semibold">{{ item.new_price }}₽</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="flex flex-wrap justify-between gap-4 mt-8">
        <form method="POST" action="/download/excel">
            <input type="hidden" name="data" value='{{ rolls|tojson }}'>
            <button type="submit"
                    class="bg-green-600 hover:bg-green-700 text-white rounded-xl p-3 font-semibold">
                Скачать Excel
            </button>
        </form>
        <form method="POST" action="/download/txt">
            <input type="hidden" name="data" value='{{ rolls|tojson }}'>
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white rounded-xl p-3 font-semibold">
                Скачать TXT
            </button>
        </form>
        <a href="/" class="bg-gray-500 hover:bg-gray-600 text-white rounded-xl p-3 font-semibold">
            Назад
        </a>
    </div>
</div>
</body>
</html>
